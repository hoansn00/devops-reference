apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: myapp
spec:
  # Voluntary disruptions (node drain, cluster upgrade) must leave 2 pods running.
  # Without a PDB, draining a node can evict every replica at once and a routine
  # cluster upgrade becomes an outage.
  minAvailable: 2
  selector:
    matchLabels: { app: myapp }
