apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 3      # matches the PDB's minAvailable: 2 with one to spare
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30     # react quickly to load
    scaleDown:
      stabilizationWindowSeconds: 300    # but shed slowly, or it flaps
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
# Requires metrics-server. Note the HPA scales on `requests`, so a missing
# resources.requests block makes CPU-based autoscaling silently inert.
