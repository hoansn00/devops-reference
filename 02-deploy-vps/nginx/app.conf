# Reverse proxy for an app on 127.0.0.1:3000 (or the "app" service in compose).
#
# The three lines people leave out — and what breaks without them:
#   client_max_body_size   → default 1m, so every file upload fails with 413
#   X-Forwarded-Proto      → the app builds http:// links and redirect loops
#   Upgrade/Connection     → websockets never connect

upstream app {
    server app:3000;              # host deploy: 127.0.0.1:3000
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP,
    # or renewal fails silently and the cert expires in 90 days.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Raising read_timeout hides a slow query rather than fixing it. If you
        # need more than 60s here, find out why and fix that too.
    }

    # Health endpoint reachable but kept out of the access log.
    location = /health {
        proxy_pass http://app;
        access_log off;
    }
}

# Behind Cloudflare, add this and set SSL mode to Full (strict) — "Flexible"
# causes redirect loops. Without real_ip, every log line and rate limit sees
# Cloudflare's IP instead of the visitor's:
#
#   set_real_ip_from <cloudflare ranges>;
#   real_ip_header CF-Connecting-IP;
