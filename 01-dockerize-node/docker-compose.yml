services:
  app:
    build: .
    image: myapp:${TAG:-local}
    restart: unless-stopped        # survives reboot; "always" also fights manual stops
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy # needs db's healthcheck below, or this is a no-op
    expose: ["3000"]               # NOT ports: — only the proxy should be public
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"            # unbounded logs fill a small VPS in weeks
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M             # a leak kills one container, not the host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data   # named volume, or `down -v` is data loss
    expose: ["5432"]                      # never `ports: 5432:5432` on a public host
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Needs real certificates at ./certs, so it will NOT start on a bare clone.
  # For a local run of just the app: docker compose up -d app db
  # On a server, get certs first (see ../02-deploy-vps/README.md), then start proxy.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]     # the only service that should bind publicly
    volumes:
      - ../02-deploy-vps/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  dbdata:
